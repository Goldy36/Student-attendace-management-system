<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-ATTEND PRO v2.0 | Smart Attendance System</title>
    <script src="./app-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; }
        .glass-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .gradient-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .gradient-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }
        .role-card { cursor: pointer; transition: all 0.3s ease; }
        .role-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3); }
        .role-card.active { border-color: #667eea; background: rgba(102, 126, 234, 0.1); }
        input, textarea { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.2) !important; }
        input:focus, textarea:focus { border-color: #667eea !important; box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1) !important; }
    </style>
</head>
<body class="text-white">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-4xl">
            <!-- Header -->
            <div class="text-center mb-12">
                <div class="inline-block mb-6 p-4 rounded-full bg-gradient-to-r from-purple-600 to-blue-600">
                    <i class="fas fa-face-smile text-3xl"></i>
                </div>
                <h1 class="text-5xl font-bold mb-2 bg-gradient-to-r from-purple-400 to-blue-400 bg-clip-text text-transparent">AI-ATTEND PRO</h1>
                <p class="text-gray-400 text-lg">Smart Attendance System v2.0</p>
            </div>

            <!-- Main Container -->
            <div class="glass-card rounded-2xl p-8 mb-8">
                <!-- Role Selection -->
                <div id="role-selection" class="mb-12">
                    <h2 class="text-2xl font-bold mb-8 text-center">Select Your Role</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Admin Card -->
                        <div class="role-card glass-card rounded-xl p-8 border-2 border-transparent text-center" data-role="admin">
                            <div class="text-5xl mb-4 text-yellow-400"><i class="fas fa-crown"></i></div>
                            <h3 class="text-xl font-bold mb-2">ADMIN</h3>
                            <p class="text-gray-400 text-sm">Dashboard & Analytics</p>
                        </div>

                        <!-- Teacher Card -->
                        <div class="role-card glass-card rounded-xl p-8 border-2 border-transparent text-center" data-role="teacher">
                            <div class="text-5xl mb-4 text-green-400"><i class="fas fa-chalkboard-user"></i></div>
                            <h3 class="text-xl font-bold mb-2">TEACHER</h3>
                            <p class="text-gray-400 text-sm">Live Session Management</p>
                        </div>

                        <!-- Student Card -->
                        <div class="role-card glass-card rounded-xl p-8 border-2 border-transparent text-center" data-role="student">
                            <div class="text-5xl mb-4 text-blue-400"><i class="fas fa-graduation-cap"></i></div>
                            <h3 class="text-xl font-bold mb-2">STUDENT</h3>
                            <p class="text-gray-400 text-sm">Face Verification</p>
                        </div>
                    </div>
                </div>

                <!-- Auth Tabs -->
                <div id="auth-form" class="hidden">
                    <div class="flex gap-4 mb-8 border-b border-gray-600">
                        <button onclick="switchTab('login')" id="login-tab" class="px-6 py-3 font-bold text-purple-400 border-b-2 border-purple-400">
                            <i class="fas fa-sign-in-alt mr-2"></i>LOGIN
                        </button>
                        <button onclick="switchTab('register')" id="register-tab" class="px-6 py-3 font-bold text-gray-400 border-b-2 border-transparent hover:text-purple-400">
                            <i class="fas fa-user-plus mr-2"></i>REGISTER
                        </button>
                    </div>

                    <!-- LOGIN TAB -->
                    <div id="login-form">
                        <form onsubmit="handleLogin(event)">
                            <div class="mb-6">
                                <label id="login-identifier-label" class="block text-sm font-bold mb-2 text-gray-300">Email Address</label>
                                <input type="email" id="login-email" placeholder="your@email.com" class="w-full px-4 py-3 rounded-lg text-white outline-none" required>
                            </div>
                            <div class="mb-8">
                                <label class="block text-sm font-bold mb-2 text-gray-300">Password</label>
                                <input type="password" id="login-password" placeholder="••••••••" class="w-full px-4 py-3 rounded-lg text-white outline-none" required>
                            </div>
                            <button type="submit" class="w-full gradient-btn py-3 rounded-lg font-bold text-white mb-4">
                                <i class="fas fa-sign-in-alt mr-2"></i>LOGIN
                            </button>
                            <button type="button" onclick="testLogin()" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-lg font-bold text-white mb-4">
                                <i class="fas fa-flask mr-2"></i>TEST LOGIN (BYPASS)
                            </button>
                            <button type="button" onclick="backToRoleSelection()" class="w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-lg font-bold text-white">
                                <i class="fas fa-arrow-left mr-2"></i>BACK
                            </button>
                        </form>
                    </div>

                    <!-- REGISTER TAB -->
                    <div id="register-form" class="hidden">
                        <form onsubmit="handleRegister(event)">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-bold mb-2 text-gray-300">Full Name</label>
                                    <input type="text" id="register-name" placeholder="John Doe" class="w-full px-4 py-3 rounded-lg text-white outline-none" required>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold mb-2 text-gray-300">Email</label>
                                    <input type="email" id="register-email" placeholder="your@email.com" class="w-full px-4 py-3 rounded-lg text-white outline-none" required>
                                </div>
                            </div>

                            <div id="student-fields" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-sm font-bold mb-2 text-gray-300">Student ID (UID)</label>
                                    <input type="text" id="register-uid" placeholder="24BCS001" class="w-full px-4 py-3 rounded-lg text-white outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold mb-2 text-gray-300">Section</label>
                                    <input type="text" id="register-section" placeholder="24BCS-601" class="w-full px-4 py-3 rounded-lg text-white outline-none">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="block text-sm font-bold mb-2 text-gray-300">Department</label>
                                <select id="register-department" class="w-full px-4 py-3 rounded-lg text-white outline-none">
                                    <option value="">Select Department</option>
                                    <option value="CSE">Computer Science & Engineering</option>
                                    <option value="ECE">Electronics & Communication</option>
                                    <option value="ME">Mechanical Engineering</option>
                                    <option value="CE">Civil Engineering</option>
                                </select>
                            </div>

                            <div class="mb-6">
                                <label class="block text-sm font-bold mb-2 text-gray-300">Password</label>
                                <input type="password" id="register-password" placeholder="••••••••" class="w-full px-4 py-3 rounded-lg text-white outline-none" required>
                            </div>

                            <button type="submit" class="w-full gradient-btn py-3 rounded-lg font-bold text-white mb-4">
                                <i class="fas fa-user-plus mr-2"></i>REGISTER
                            </button>
                            <button type="button" onclick="backToRoleSelection()" class="w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-lg font-bold text-white">
                                <i class="fas fa-arrow-left mr-2"></i>BACK
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="error-message" class="hidden bg-red-900/30 border border-red-500 text-red-300 px-6 py-4 rounded-lg mb-6">
                    <i class="fas fa-exclamation-circle mr-2"></i><span id="error-text"></span>
                </div>

                <!-- Success Message -->
                <div id="success-message" class="hidden bg-green-900/30 border border-green-500 text-green-300 px-6 py-4 rounded-lg mb-6">
                    <i class="fas fa-check-circle mr-2"></i><span id="success-text"></span>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center text-gray-500 text-sm">
                <p>🔒 Secure • 🌐 Real-time • 📊 Analytics</p>
                <p class="mt-2">AI-ATTEND PRO © 2024 | All Rights Reserved</p>
            </div>
        </div>
    </div>

    <script>
        function configureApiBase() {
            if (window.__apiFetchConfigured) {
                return window.__apiBaseUrl || '';
            }

            const configuredBase = (window.APP_CONFIG && window.APP_CONFIG.API_BASE_URL ? window.APP_CONFIG.API_BASE_URL : '').trim();
            const manualBase = (window.API_BASE_URL || configuredBase || localStorage.getItem('API_BASE_URL') || '').trim();
            const { protocol, hostname, port } = window.location;
            const isLocalNetworkHost = ['localhost', '127.0.0.1', '::1'].includes(hostname)
                || /^192\.168\./.test(hostname)
                || /^10\./.test(hostname)
                || /^172\.(1[6-9]|2\d|3[0-1])\./.test(hostname);

            const shouldUseLocalBackend = protocol === 'file:' || !hostname || (isLocalNetworkHost && port !== '3000');
            const inferredBase = !manualBase && shouldUseLocalBackend ? 'http://localhost:3000' : '';

            const baseUrl = (manualBase || inferredBase).replace(/\/+$/, '');
            const localFallbackBase = 'http://localhost:3000';

            const nativeFetch = window.fetch.bind(window);
            window.fetch = async (resource, options) => {
                if (typeof resource === 'string' && resource.startsWith('/api/')) {
                    const apiPath = resource;
                    if (!baseUrl && !shouldUseLocalBackend) {
                        throw new Error('Backend API URL is not configured. Set APP_CONFIG.API_BASE_URL in app-config.js');
                    }
                    const primaryUrl = baseUrl ? `${baseUrl}${apiPath}` : apiPath;
                    try {
                        return await nativeFetch(primaryUrl, options);
                    } catch (primaryError) {
                        if (baseUrl && baseUrl !== localFallbackBase) {
                            try {
                                const fallbackResponse = await nativeFetch(`${localFallbackBase}${apiPath}`, options);
                                window.__apiBaseUrl = localFallbackBase;
                                return fallbackResponse;
                            } catch (_) {
                                // Ignore fallback errors and throw the original issue below.
                            }
                        }
                        throw primaryError;
                    }
                }
                return nativeFetch(resource, options);
            };

            window.__apiBaseUrl = baseUrl;
            window.__apiFetchConfigured = true;
            return baseUrl;
        }

        const API_BASE_URL = configureApiBase();
        let selectedRole = '';

        function configureLoginIdentifierInput(role) {
            const label = document.getElementById('login-identifier-label');
            const input = document.getElementById('login-email');
            if (!label || !input) return;

            if (role === 'student') {
                label.textContent = 'Student UID';
                input.type = 'text';
                input.placeholder = '24BAI7001';
                input.autocomplete = 'username';
            } else {
                label.textContent = 'Email Address';
                input.type = 'email';
                input.placeholder = 'your@email.com';
                input.autocomplete = 'email';
            }

            input.value = '';
        }

        function selectRole(role, cardElement = null) {
            selectedRole = role;
            document.querySelectorAll('.role-card').forEach(card => card.classList.remove('active'));
            const activeCard = cardElement || document.querySelector(`.role-card[data-role="${role}"]`);
            activeCard?.classList.add('active');
            document.getElementById('role-selection').classList.add('hidden');
            document.getElementById('auth-form').classList.remove('hidden');
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-tab').classList.add('text-purple-400', 'border-purple-400');
            document.getElementById('register-tab').classList.remove('text-purple-400', 'border-purple-400');
            document.getElementById('register-tab').classList.add('text-gray-400', 'border-transparent');
            configureLoginIdentifierInput(role);

            // Show student-specific fields
            if (role === 'student') {
                document.getElementById('student-fields').classList.remove('hidden');
                document.getElementById('register-uid').required = true;
                document.getElementById('register-section').required = true;
            } else {
                document.getElementById('student-fields').classList.add('hidden');
                document.getElementById('register-uid').required = false;
                document.getElementById('register-section').required = false;
            }
        }

        function switchTab(tab) {
            document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
            document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
            document.getElementById('login-tab').classList.toggle('text-purple-400', tab === 'login');
            document.getElementById('login-tab').classList.toggle('border-purple-400', tab === 'login');
            document.getElementById('register-tab').classList.toggle('text-purple-400', tab === 'register');
            document.getElementById('register-tab').classList.toggle('border-purple-400', tab === 'register');
        }

        function backToRoleSelection() {
            selectedRole = '';
            document.getElementById('role-selection').classList.remove('hidden');
            document.getElementById('auth-form').classList.add('hidden');
            document.querySelectorAll('.role-card').forEach(card => card.classList.remove('active'));
            configureLoginIdentifierInput('');
            hideMessages();
        }

        function showError(message) {
            document.getElementById('error-text').textContent = message;
            document.getElementById('error-message').classList.remove('hidden');
            setTimeout(() => document.getElementById('error-message').classList.add('hidden'), 5000);
        }

        function showSuccess(message) {
            document.getElementById('success-text').textContent = message;
            document.getElementById('success-message').classList.remove('hidden');
        }

        function hideMessages() {
            document.getElementById('error-message').classList.add('hidden');
            document.getElementById('success-message').classList.add('hidden');
        }

        async function parseApiResponse(response) {
            const raw = await response.text();

            try {
                return raw ? JSON.parse(raw) : {};
            } catch (parseError) {
                const compact = raw.replace(/\s+/g, ' ').trim();
                throw new Error(compact ? `Server returned non-JSON response: ${compact.slice(0, 180)}` : 'Server returned an empty response');
            }
        }

        function formatNetworkError(error) {
            const message = String(error?.message || '');
            const isFetchFailure = error?.name === 'TypeError' || /failed to fetch/i.test(message);
            if (!isFetchFailure) {
                return message || 'Request failed';
            }

            const resolvedBase = window.__apiBaseUrl || '(same origin)';
            return `Cannot reach backend API (${resolvedBase}). Start backend with: npm start, then open: http://localhost:3000/index.html`;
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideMessages();

            if (!['admin', 'teacher', 'student'].includes(selectedRole)) {
                showError('Please select a role first');
                return;
            }

            const loginIdentifier = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            if (!loginIdentifier || !password) {
                showError('Please enter login credentials');
                return;
            }

            const body = { password, role: selectedRole };
            if (selectedRole === 'student') {
                body.uid = loginIdentifier.toUpperCase();
            } else {
                body.email = loginIdentifier.toLowerCase();
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await parseApiResponse(response);

                if (!response.ok) {
                    throw new Error(data.error || `Login failed: ${response.status}`);
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('userRole', data.user.role);
                localStorage.setItem('userName', data.user.name);
                localStorage.setItem('userId', data.user.id);
                localStorage.removeItem('offlineMode');

                showSuccess('Login successful! Redirecting...');
                setTimeout(() => {
                    if (data.user.role === 'admin') window.location.href = 'admin.html';
                    else if (data.user.role === 'teacher') window.location.href = 'teacher.html';
                    else window.location.href = 'student.html';
                }, 1000);
            } catch (error) {
                showError(formatNetworkError(error));
            }
        }

        // Test login (bypass authentication)
        async function testLogin() {
            hideMessages();
            if (!['admin', 'teacher', 'student'].includes(selectedRole)) {
                showError('Please select a role first');
                return;
            }

            try {
                const response = await fetch('/api/auth/test-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: selectedRole })
                });

                const data = await parseApiResponse(response);

                if (!response.ok) {
                    throw new Error(data.error || `Test login failed: ${response.status}`);
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('userRole', data.user.role);
                localStorage.setItem('userName', data.user.name);
                localStorage.setItem('userId', data.user.id);
                localStorage.removeItem('offlineMode');

                showSuccess(`Test Login (${data.user.role})! Redirecting...`);
                setTimeout(() => {
                    if (data.user.role === 'admin') window.location.href = 'admin.html';
                    else if (data.user.role === 'teacher') window.location.href = 'teacher.html';
                    else window.location.href = 'student.html';
                }, 1000);
            } catch (error) {
                const offlineUser = {
                    id: `offline-${selectedRole}`,
                    role: selectedRole,
                    name: `Offline ${selectedRole.charAt(0).toUpperCase()}${selectedRole.slice(1)}`
                };

                localStorage.setItem('token', `offline-${selectedRole}-${Date.now()}`);
                localStorage.setItem('userRole', offlineUser.role);
                localStorage.setItem('userName', offlineUser.name);
                localStorage.setItem('userId', offlineUser.id);
                localStorage.setItem('offlineMode', 'true');

                showSuccess(`Backend unavailable (${error.message}). Running offline test mode as ${offlineUser.role}. Redirecting...`);
                setTimeout(() => {
                    if (offlineUser.role === 'admin') window.location.href = 'admin.html';
                    else if (offlineUser.role === 'teacher') window.location.href = 'teacher.html';
                    else window.location.href = 'student.html';
                }, 1000);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            hideMessages();

            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const department = document.getElementById('register-department').value;

            const body = { email, password, role: selectedRole, name, department };

            if (selectedRole === 'student') {
                body.uid = document.getElementById('register-uid').value;
                body.section = document.getElementById('register-section').value;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await parseApiResponse(response);

                if (!response.ok) {
                    throw new Error(data.error || `Registration failed: ${response.status}`);
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('userRole', data.user.role);
                localStorage.setItem('userName', data.user.name);
                localStorage.setItem('userId', data.user.id);
                localStorage.removeItem('offlineMode');

                showSuccess('Registration successful! Redirecting...');
                setTimeout(() => {
                    if (data.user.role === 'admin') window.location.href = 'admin.html';
                    else if (data.user.role === 'teacher') window.location.href = 'teacher.html';
                    else window.location.href = 'student.html';
                }, 1500);
            } catch (error) {
                showError(formatNetworkError(error));
            }
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            document.querySelectorAll('.role-card').forEach(card => {
                card.addEventListener('click', () => selectRole(card.dataset.role, card));
            });

            if (localStorage.getItem('token')) {
                const role = localStorage.getItem('userRole');
                if (role === 'admin') window.location.href = 'admin.html';
                else if (role === 'teacher') window.location.href = 'teacher.html';
                else window.location.href = 'student.html';
            }
        });
    </script>
</body>
</html>
